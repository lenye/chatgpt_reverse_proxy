version: 2


project_name: chatgpt_reverse_proxy


before:
  hooks:
    - go mod tidy


builds:
  - id: reverse_proxy
    binary: chatgpt_reverse_proxy
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/lenye/chatgpt_reverse_proxy/version.AppName={{.ProjectName}}
      - -X github.com/lenye/chatgpt_reverse_proxy/version.Version={{.Version}}
      - -X github.com/lenye/chatgpt_reverse_proxy/version.BuildCommit={{.ShortCommit}}
      - -X github.com/lenye/chatgpt_reverse_proxy/version.BuildTime={{.CommitDate}}
      - -extldflags
      - -static
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - "amd64"
      - "arm64"
      - "riscv64"
      - "loong64"
      - "s390x"
      - "ppc64le"
      - "386"
      - "arm"
    goarm:
      - 7
      - 6
    ignore:
      - goos: windows
        goarch: arm
    mod_timestamp: '{{ .CommitTimestamp }}'

  - id: tencentcloud_scf
    binary: main
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/lenye/chatgpt_reverse_proxy/version.AppName={{.ProjectName}}
      - -X github.com/lenye/chatgpt_reverse_proxy/version.Version={{.Version}}
      - -X github.com/lenye/chatgpt_reverse_proxy/version.BuildCommit={{.ShortCommit}}
      - -X github.com/lenye/chatgpt_reverse_proxy/version.BuildTime={{.CommitDate}}
      - -extldflags
      - -static
    flags:
      - -trimpath
      - -tags=tencentcloud_scf
    goos:
      - linux
    goarch:
      - amd64
    goamd64:
      - v3
    mod_timestamp: '{{ .CommitTimestamp }}'

  - id: aliyun_fc
    binary: main
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/lenye/chatgpt_reverse_proxy/version.AppName={{.ProjectName}}
      - -X github.com/lenye/chatgpt_reverse_proxy/version.Version={{.Version}}
      - -X github.com/lenye/chatgpt_reverse_proxy/version.BuildCommit={{.ShortCommit}}
      - -X github.com/lenye/chatgpt_reverse_proxy/version.BuildTime={{.CommitDate}}
      - -extldflags
      - -static
    flags:
      - -trimpath
      - -tags=aliyun_fc
    goos:
      - linux
    goarch:
      - amd64
    goamd64:
      - v3
    mod_timestamp: '{{ .CommitTimestamp }}'



archives:
  - id: reverse_proxy
    ids:
      - reverse_proxy
    name_template: >-
      {{ .ProjectName }}_v{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    formats: [ "tar.gz" ]
    format_overrides:
      - goos: windows
        formats: [ "zip" ]
    files:
      - LICENSE
      - README.md

  - id: tencentcloud_scf
    ids:
      - tencentcloud_scf
    name_template: >-
      tencentcloud_scf_chatgpt_reverse_proxy_v{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    formats: [ "zip" ]
    files:
      - scf_bootstrap
      - LICENSE
      - README.md

  - id: aliyun_fc
    ids:
      - aliyun_fc
    name_template: >-
      aliyun_fc_chatgpt_reverse_proxy_v{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    formats: [ "zip" ]
    files:
      - LICENSE
      - README.md


checksum:
  name_template: "{{ .ProjectName }}_v{{ .Version }}_sha256_checksums.txt"
  algorithm: sha256


changelog:
  filters:
    exclude:
      - '^wip:'
      - '^docs:'
      - '^test:'
      - '^style:'
      - '^chore:'
      - '^ci:'


release:
  draft: true
  replace_existing_draft: true
